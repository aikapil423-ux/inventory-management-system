name: Keep Render API awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://haryana-police-api.onrender.com/api/health || true)
          echo "Health check returned HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Unexpected status (may still be warm) - not failing the job"
          fi